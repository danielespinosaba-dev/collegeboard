<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versión imprimible · College Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #003865; --gold: #f5a800; --border: #333; --gray: #666;
}
* { box-sizing: border-box; }
body {
  font-family: 'Source Sans 3', sans-serif; color: #111; max-width: 820px;
  margin: 0 auto; padding: 24px; line-height: 1.5;
}
.toolbar { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
.toolbar button {
  padding: 10px 20px; font-size: 14px; font-weight: 600; border: 1.5px solid var(--navy);
  background: var(--navy); color: #fff; cursor: pointer;
}
.toolbar button.outline { background: transparent; color: var(--navy); }
.header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--gold); padding-bottom: 12px; margin-bottom: 16px; }
.header-left h1 { font-family: 'Merriweather', serif; font-size: 20px; color: var(--navy); margin: 0 0 2px; }
.header-left .sub { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.06em; }
.qr-box { text-align: center; font-size: 10px; color: var(--gray); }
.fields { display: flex; gap: 24px; margin-bottom: 20px; font-size: 13px; }
.fields .f { flex: 1; border-bottom: 1px solid #999; padding-bottom: 4px; }
.fields .f label { display: block; font-size: 10px; text-transform: uppercase; color: var(--gray); margin-bottom: 10px; }
.passage-block { background: #f6f6f6; border-left: 3px solid var(--gold); padding: 10px 14px; margin: 14px 0 10px; }
.passage-block .ptitle { font-weight: 700; font-style: italic; font-size: 13px; margin-bottom: 6px; color: var(--navy); }
.passage-block .ptext { font-family: 'Merriweather', serif; font-size: 13px; white-space: pre-wrap; line-height: 1.7; }
.question { margin-bottom: 18px; page-break-inside: avoid; }
.question .qnum { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.question .qstem { font-family: 'Merriweather', serif; font-size: 14px; margin-bottom: 8px; }
.question .opts { margin-left: 4px; }
.question .opt { font-size: 13px; margin-bottom: 4px; }
.question .opt b { display: inline-block; width: 18px; }
.answer-sheet { page-break-before: always; }
.answer-sheet h2 { font-family: 'Merriweather', serif; color: var(--navy); border-bottom: 2px solid var(--gold); padding-bottom: 8px; }
.answer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 32px; margin-top: 16px; }
.answer-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.answer-row .num { font-weight: 700; width: 24px; }
.bubble { width: 22px; height: 22px; border: 1.5px solid #333; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-right: 6px; }
.text-large .qstem { font-size: 19px; }
.text-large .opt { font-size: 17px; }
.text-large .passage-block .ptext { font-size: 16px; }
.text-large .bubble { width: 28px; height: 28px; font-size: 13px; }
.loading { text-align: center; padding: 60px 0; color: var(--gray); }
@media print {
  .toolbar { display: none; }
  body { padding: 0; max-width: none; }
}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨 Imprimir</button>
  <button class="outline" onclick="window.close()">Cerrar</button>
</div>

<div id="content"><div class="loading">Cargando examen…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import CONFIG from './config.js';
window.CONFIG = CONFIG;
</script>
<script>
const { createClient } = supabase;
const sb = createClient(window.CONFIG?.SUPABASE_URL || 'https://euwsjtcvfwcivywpkyyn.supabase.co', window.CONFIG?.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1d3NqdGN2ZndjaXZ5d3BreXluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDUyMTgsImV4cCI6MjA5NDY4MTIxOH0.w2s8ZCaCKe_w25uuqKU5Io520SM_ecABdrTMQI95Swk');

const letters = ['A', 'B', 'C', 'D'];

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function init() {
  const examId = new URLSearchParams(location.search).get('exam');
  const content = document.getElementById('content');
  if (!examId) { content.innerHTML = '<p>Falta el parámetro ?exam=ID en la URL.</p>'; return; }

  const { data: exam, error: examError } = await sb.from('exams').select('*, groups(name)').eq('id', examId).single();
  if (examError || !exam) { content.innerHTML = '<p>No se encontró el examen.</p>'; return; }

  const { data: qData, error: qError } = await sb.from('questions').select('*').in('id', exam.question_ids);
  if (qError || !qData) { content.innerHTML = '<p>Error al cargar los reactivos.</p>'; return; }
  const questions = exam.question_ids.map(id => qData.find(q => q.id === id)).filter(Boolean);

  const grades = questions.map(q => q.grade_level).filter(Boolean);
  const minGrade = grades.length ? Math.min(...grades) : null;
  if (minGrade && minGrade <= 3) document.body.classList.add('text-large');

  let lastPassageKey = null;
  const questionsHtml = questions.map((q, i) => {
    let passageHtml = '';
    const passageKey = q.reading_passage ? (q.reading_title || '') + '|' + q.reading_passage : null;
    if (passageKey && passageKey !== lastPassageKey) {
      passageHtml = `<div class="passage-block">
        <div class="ptitle">${escapeHtml(q.reading_title || 'Lectura')}</div>
        <div class="ptext">${q.reading_passage}</div>
      </div>`;
    }
    lastPassageKey = passageKey;
    const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
    return `${passageHtml}<div class="question">
      <div class="qnum">${i + 1}.</div>
      <div class="qstem">${q.stem}</div>
      <div class="opts">
        ${opts.map((opt, j) => `<div class="opt"><b>${letters[j]})</b> ${opt}</div>`).join('')}
      </div>
    </div>`;
  }).join('');

  const answerRows = questions.map((_, i) => `
    <div class="answer-row">
      <span class="num">${i + 1}.</span>
      ${letters.map(l => `<span class="bubble">${l}</span>`).join('')}
    </div>`).join('');

  content.innerHTML = `
    <div class="header">
      <div class="header-left">
        <h1>${escapeHtml(exam.name)}</h1>
        <div class="sub">College Board · ${escapeHtml(exam.groups?.name || '')} · Código ${escapeHtml(exam.exam_code || '')}</div>
      </div>
      <div class="qr-box">
        <div id="qrBox"></div>
        Escanea para<br>contestar en línea
      </div>
    </div>
    <div class="fields">
      <div class="f"><label>Nombre del alumno</label></div>
      <div class="f" style="max-width:140px;"><label>Fecha</label></div>
    </div>
    ${questionsHtml}
    <div class="answer-sheet">
      <h2>Hoja de respuestas</h2>
      <p style="font-size:13px;color:#666;">Rellena por completo el círculo de la respuesta correcta para cada número.</p>
      <div class="answer-grid">${answerRows}</div>
    </div>
  `;

  if (exam.exam_code) {
    new QRCode(document.getElementById('qrBox'), {
      text: `${location.origin}/students.html?code=${exam.exam_code}`,
      width: 90, height: 90
    });
  }
}
init();
</script>
</body>
</html>
