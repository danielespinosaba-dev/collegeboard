<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña · PIENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #4358a7; --sky: #2591cf; --sky-dark: #1b6fa0;
    --accent: #f59131; --accent-dark: #d9780f;
    --text: #1a1a2e; --text-2: #4a5568; --text-3: #8896a6;
    --surface: #ffffff; --border: #e2e8f0;
    --danger: #ef4444; --danger-bg: #fef2f2;
    --success: #22c55e; --success-bg: #f0fdf4;
    --radius: 14px;
    --font-friendly: 'Baloo 2', 'DM Sans', sans-serif;
  }
  body {
    font-family: 'DM Sans', sans-serif; color: var(--text); font-size: 15px; line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: linear-gradient(135deg, rgba(67,88,167,0.88), rgba(27,111,160,0.78));
  }
  .box {
    background: var(--surface); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.35); position: relative; overflow: hidden;
  }
  .box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--accent), var(--sky)); }
  .logo { font-family: var(--font-friendly); font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--text-3); margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 14px; color: var(--text); }
  .field input:focus { outline: none; border-color: var(--sky); }
  .btn { width: 100%; padding: 11px 18px; border-radius: var(--radius); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border: none; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .msg { font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; }
  .msg.error { background: var(--danger-bg); color: var(--danger); }
  .msg.success { background: var(--success-bg); color: var(--success); }
  .hidden { display: none; }
  a.link { color: var(--sky-dark); text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">PIENSE</div>
  <div class="sub">Define tu nueva contraseña</div>

  <div id="msgBox"></div>

  <form id="resetForm">
    <div class="field">
      <label for="newPassword">Nueva contraseña</label>
      <input type="password" id="newPassword" minlength="6" required>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirmar contraseña</label>
      <input type="password" id="confirmPassword" minlength="6" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Guardar contraseña</button>
  </form>

  <div id="doneBox" class="hidden" style="margin-top:4px">
    <a class="link" href="index.html">Ir a iniciar sesión</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module">
import CONFIG from './config.js';
window.CONFIG = CONFIG;
</script>
<script>
const { createClient } = supabase;
const sb = createClient(window.CONFIG?.SUPABASE_URL || 'https://euwsjtcvfwcivywpkyyn.supabase.co', window.CONFIG?.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1d3NqdGN2ZndjaXZ5d3BreXluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDUyMTgsImV4cCI6MjA5NDY4MTIxOH0.w2s8ZCaCKe_w25uuqKU5Io520SM_ecABdrTMQI95Swk');

const msgBox = document.getElementById('msgBox');
const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');
const doneBox = document.getElementById('doneBox');

function showMsg(text, type) {
  msgBox.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

let recoveryReady = false;

sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    recoveryReady = true;
  }
});

// Si el evento ya disparó antes de que este listener se registrara, getSession()
// confirma que sí hay una sesión de recuperación activa en memoria.
sb.auth.getSession().then(({ data }) => {
  if (data?.session) recoveryReady = true;
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword.length < 6) return showMsg('Mínimo 6 caracteres', 'error');
  if (newPassword !== confirmPassword) return showMsg('Las contraseñas no coinciden', 'error');
  if (!recoveryReady) {
    return showMsg('Este enlace ya no es válido. Pide uno nuevo desde "olvidé mi contraseña".', 'error');
  }

  submitBtn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: newPassword });
  submitBtn.disabled = false;

  if (error) return showMsg('No se pudo guardar: ' + error.message, 'error');

  showMsg('Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
  form.classList.add('hidden');
  doneBox.classList.remove('hidden');
});
</script>
</body>
</html>
